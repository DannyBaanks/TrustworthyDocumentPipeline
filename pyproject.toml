[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-document-pipeline"
version = "0.1.0"
description = "Auditable document processing with confidence gates and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["requests>=2.31,<3"]

[project.scripts]
trustdocs = "trustdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
