[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-document-pipeline"
version = "0.1.0"
description = "Auditable document processing with confidence gates and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
# Only the vendor-independent local extractor needs to read PDFs itself;
# the DWS path sends bytes and gets fields back.
local = ["pypdf>=4"]
# Regenerating sample/invoice.pdf from tools/generate_invoice.py.
tools = ["reportlab>=4"]
# Running lint + formatting.
dev = ["ruff>=0.6"]
# GUI (PySide6 desktop application).
gui = ["PySide6>=6.6,<7"]

[project.urls]
Homepage = "https://github.com/DannyBaanks/trustworthy-document-pipeline"
Repository = "https://github.com/DannyBaanks/trustworthy-document-pipeline"

[project.scripts]
trustdocs = "trustdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
